entries:
  TREESEED_CODEX_API_KEY:
    label: Codex API key
    group: auth
    description: Optional API-billed OpenAI key used by TreeSeed's Codex SDK adapter when Codex login auth.json is not available.
    howToGet: >-
      Prefer subscription-backed Codex login, which creates ~/.codex/auth.json.
      Use TREESEED_CODEX_API_KEY only when API billing is intended: create or find a key
      at https://platform.openai.com/api-keys, then store it as TREESEED_CODEX_API_KEY.
      Do not commit it, print it, or paste it into logs. If this is the first
      API key on the account, OpenAI may require phone verification before the
      key can be created.
    sensitivity: secret
    targets:
      - local-runtime
      - github-secret
      - railway-secret
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - agent-execution
      - config
    validation:
      kind: nonempty
      minLength: 20
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: codexExecutionSelected
  TREESEED_CODEX_AUTH_FILE:
    label: Codex auth file
    group: auth
    description: Optional path to a Codex login auth.json file. Defaults to ~/.codex/auth.json, or $CODEX_HOME/auth.json when CODEX_HOME is set.
    howToGet: >-
      Run Codex login on a trusted machine to create ~/.codex/auth.json, then
      copy that file to the service host if needed. Store the path here only
      when the file is not at the default location. Treat auth.json like a
      secret and do not commit or print it.
    sensitivity: secret
    targets:
      - local-runtime
      - github-secret
      - railway-secret
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - agent-execution
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: codexExecutionSelected
  TREESEED_CODEX_AUTH_JSON_B64:
    label: Codex auth JSON bootstrap secret
    group: auth
    description: Base64-encoded Codex login auth.json used only to bootstrap a missing auth file on a worker volume.
    howToGet: >-
      On a trusted machine, run Codex login with the automation account, then
      base64-encode the resulting auth.json and store it as a Railway secret.
      TreeSeed writes it to TREESEED_CODEX_AUTH_FILE, or to
      /data/codex/auth.json in provider diagnostic mode, only when the file is
      missing. Do not bake this value into images, logs, source files, or test
      fixtures. Because Codex may refresh and rewrite auth.json, keep the file
      on a persistent worker volume and avoid overwriting it on every boot.
    sensitivity: secret
    targets:
      - railway-secret
      - github-secret
    scopes:
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - agent-execution
      - bootstrap
      - config
    validation:
      kind: nonempty
      minLength: 20
    sourcePriority:
      - process-env
    relevanceRef: codexExecutionSelected
  TREESEED_CODEX_AUTH_JSON:
    label: Codex auth JSON bootstrap secret
    group: auth
    description: Raw Codex login auth.json used only to bootstrap a missing auth file. Prefer TREESEED_CODEX_AUTH_JSON_B64 for hosted secrets.
    howToGet: >-
      On a trusted machine, run Codex login with the automation account, then
      store the resulting auth.json content as a hosted secret only when base64
      transport is not available. Prefer TREESEED_CODEX_AUTH_JSON_B64 for
      Railway and GitHub environments.
    sensitivity: secret
    targets:
      - railway-secret
    scopes:
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - agent-execution
      - bootstrap
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - process-env
    relevanceRef: codexExecutionSelected
  TREESEED_CODEX_AUTH_OVERWRITE:
    label: Overwrite Codex auth file
    group: auth
    description: Set to 1 only during an intentional auth rotation. By default TreeSeed will not overwrite an existing auth.json because Codex may have refreshed it on the persistent worker volume.
    howToGet: Leave unset for normal operation. Set to 1 only while intentionally rotating a hosted Codex login secret.
    sensitivity: plain
    targets:
      - railway-var
      - local-runtime
    scopes:
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - agent-execution
      - bootstrap
      - config
    validation:
      kind: boolean
    sourcePriority:
      - process-env
    relevanceRef: codexExecutionSelected
  TREESEED_CODEX_SUBSCRIPTION_PLAN:
    label: Codex subscription plan
    group: auth
    description: Declares the Codex subscription tier used by the processing workers for readiness reporting and policy diagnostics.
    howToGet: Set this to the subscription plan for the automation account used by hosted Codex workers.
    sensitivity: plain
    targets:
      - local-runtime
      - github-variable
      - railway-var
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - agent-execution
      - config
    validation:
      kind: enum
      values:
        - plus
        - pro
        - business
        - edu
        - enterprise
        - unknown
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: codexExecutionSelected
  TREESEED_CODEX_DEFAULT_MODEL:
    label: Codex default model
    group: auth
    description: Default model passed to Codex-backed agent execution when an agent spec does not provide a narrower model.
    howToGet: Use the approved default model for the worker environment, such as gpt-5.5.
    sensitivity: plain
    targets:
      - local-runtime
      - github-variable
      - railway-var
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - agent-execution
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: codexExecutionSelected
  TREESEED_CODEX_APPROVAL_POLICY:
    label: Codex approval policy
    group: auth
    description: Approval policy passed to Codex execution for hosted workers.
    howToGet: Use never for noninteractive hosted workers unless a governed workflow explicitly supports request handling.
    sensitivity: plain
    targets:
      - local-runtime
      - github-variable
      - railway-var
    scopes:
