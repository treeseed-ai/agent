name: Treeseed Capacity Provider Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: staging
        type: choice
        options:
          - staging
          - prod

jobs:
  deploy-capacity-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package-owned provider role images
        run: |
          npm ci --ignore-scripts
          npm run capacity-provider:build -- --prepare-only
          docker build --target agent-manager -t treeseed/agent-manager:${{ inputs.environment }} .
          docker build --target agent-runner -t treeseed/agent-runner:${{ inputs.environment }} .
      - name: Deployment handoff
        run: |
          echo "Deploy manager and runner role images with Market-managed host secrets."
