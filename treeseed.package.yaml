id: "@treeseed/agent"
name: TreeSeed Agent
kind: node-typescript
type: runtime-provider
repository: treeseed-ai/agent
publishTarget: docker
deploymentSource:
  staging: git
  prod: image
workflowTemplateVersion: "1"
githubEnvironments:
  - staging
  - production
requiredSecrets:
  - TREESEED_DOCKERHUB_TOKEN
  - NPM_TOKEN
requiredVariables:
  - TREESEED_DOCKERHUB_USERNAME
verify:
  fast: npm run verify
  local: npm run verify:local
  release: npm run release:verify
artifacts:
  - provider: docker
    name: treeseed/agent-manager
    dockerfile: Dockerfile
    target: agent-manager
    role: manager
    architectures:
      - amd64
      - arm64
  - provider: docker
    name: treeseed/agent-runner
    dockerfile: Dockerfile
    target: agent-runner
    role: runner
    architectures:
      - amd64
      - arm64
releaseGate:
  workflow: verify.yml
development:
  schemaVersion: treeseed.development-runtime/v1
  project: { id: agent, repository: treeseed-ai/agent }
  defaults: { leaseSeconds: 14400, restoreOnFailure: true }
  targets:
    - id: provider
      kind: rebuild-restart
      platforms: [linux-amd64, linux-arm64]
      runtimeRequirements: [node>=22, docker]
      sourceRoots: [src, Dockerfile, compose.capacity-provider.yml]
      ignoredPaths: [dist, node_modules, .treeseed/local-capacity-providers]
      operations:
        build: { command: bash, args: [scripts/development/runtime.sh, rebuild], environment: {}, timeoutSeconds: 86400 }
        stop: { command: bash, args: [scripts/development/runtime.sh, drain], environment: {}, timeoutSeconds: 300 }
        verify: { command: bash, args: [scripts/development/runtime.sh, verify], environment: {}, timeoutSeconds: 1800 }
        cleanup: { command: bash, args: [scripts/development/runtime.sh, cleanup], environment: {}, timeoutSeconds: 300 }
      ready: { kind: process, graceSeconds: 5 }
      outputs: [{ path: dist, mediaType: application/vnd.treeseed.agent-runtime, digestAlgorithm: sha256 }]
      endpoints: []
      dependencies:
        - { id: sdk, target: package, locality: local, reaction: rebuild }
        - { id: api, target: service, capability: control-plane-api, locality: either, reaction: manual }
      statePolicy: clone
      migrationPolicy: disposable-only
      secretRefs: {}
      shutdown: { drainOperation: { command: bash, args: [scripts/development/runtime.sh, drain], environment: {}, timeoutSeconds: 300 }, graceSeconds: 120, activeWorkPolicy: drain }
      resources: {}
      logs: [.treeseed/development/provider.log]
      forbiddenOperations: [hot-reload, force-kill-active-assignment, automatic-assignment-cancel]
      freeze:
        kind: archive
        operation: { command: npm, args: [pack, --json], environment: {}, timeoutSeconds: 1800 }
        artifacts: [treeseed-agent-*.tgz]
        contractOperations: []
      promotion: { liveAdmissible: false, candidateRequiresVerification: true }
dockerImages:
  releaseWorkflow: publish.yml
  architectures:
    - amd64
    - arm64
  tags:
    release:
      - "<version>"
      - latest
capacityProvider:
  roles:
    manager:
      image: treeseed/agent-manager
      target: agent-manager
    runner:
      image: treeseed/agent-runner
      target: agent-runner
  local:
    composeFile: compose.capacity-provider.yml
    projectName: treeseed-capacity-provider
    sharedVolume: true
    dataDir: .treeseed/local-capacity-providers/agent-standalone
  capabilities: []
  executionProviders: []
  envBindings: []
  resourceLimits: {}
projectArchitecture:
  topology: split_site_content
  rootPath: .
  sitePath: docs
  contentPath: src/content
  contentRuntimeSource: r2_preview_overlay
  localContentMaterialization: none
  contentPublishTarget:
    kind: cloudflare_r2
    prefix: packages/agent
packageRuntime:
  schemaVersion: treeseed.package-runtime/v1
  componentId: agent
  services:
    - id: manager
      composeService: manager
      healthGate:
        kind: compose-healthcheck
        timeoutSeconds: 60
      endpoints: []
    - id: runner
      composeService: runner
      endpoints: []
  defaultAliases: []
