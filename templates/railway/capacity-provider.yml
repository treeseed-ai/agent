# Railway service template for hosted capacity provider deployments.
# Secrets are injected by Market deployment flows or `trsd capacity`; do not render plaintext env files.

services:
  api:
    name: treeseed-capacity-provider-api
    image: ghcr.io/treeseed-ai/agent:capacity-provider
    startCommand: node ./dist/provider/entrypoint.js api
    variables:
      TREESEED_PROVIDER_DATA_DIR: /data
      TREESEED_PROVIDER_API_PORT: "3100"
      TREESEED_PROVIDER_STARTUP_MODE: live
  manager:
    name: treeseed-capacity-provider-manager
    image: ghcr.io/treeseed-ai/agent:capacity-provider
    startCommand: node ./dist/provider/entrypoint.js manager
    variables:
      TREESEED_PROVIDER_DATA_DIR: /data
      TREESEED_PROVIDER_STARTUP_MODE: live
  runner:
    name: treeseed-capacity-provider-runner
    image: ghcr.io/treeseed-ai/agent:capacity-provider
    startCommand: node ./dist/provider/entrypoint.js runner
    variables:
      TREESEED_PROVIDER_DATA_DIR: /data
      TREESEED_PROVIDER_STARTUP_MODE: live
