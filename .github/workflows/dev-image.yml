name: Development Image TreeSeed Agent

on:
  workflow_dispatch:
  push:
    branches:
      - staging

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    environment: staging
    strategy:
      matrix:
        include:
          - image: treeseed/agent-api
            target: agent-api
          - image: treeseed/agent-manager
            target: agent-manager
          - image: treeseed/agent-runner
            target: agent-runner
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: npm run release:setup || (echo "dependency install failed; retrying" && npm run release:setup)
      - run: npm run capacity-provider:build -- --prepare-only
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=dev-staging-,format=short
            type=raw,value=dev-staging
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
