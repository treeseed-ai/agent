    description: Project-scoped Railway token used by the Railway CLI for CI deploy uploads. Treeseed can mint a scoped token from the shared SDK-owned Railway API token during provider deploys when this is not configured.
    howToGet: In Railway, open the target project environment settings, create a project token, and store it as TREESEED_RAILWAY_PROJECT_TOKEN. Leave unset when Treeseed should mint an ephemeral CI deploy token from TREESEED_RAILWAY_API_TOKEN.
    sensitivity: secret
    targets:
      - github-secret
    scopes:
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - deploy
    validation:
      kind: nonempty
      minLength: 8
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: railwayManagedEnabled
  TREESEED_RAILWAY_WORKSPACE:
    label: Railway workspace
    group: railway
    description: Railway workspace Treeseed should use when listing or creating projects during bootstrap and config reconciliation.
    howToGet: In Railway, use the workspace slug or name shown in the workspace switcher. Treeseed defaults this repository to knowledge-coop unless you override it here.
    sensitivity: plain
    targets:
      - railway-var
    scopes:
      - staging
      - prod
    storage: shared
    requirement: conditional
    purposes:
