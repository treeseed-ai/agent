name: Pull Request Submission Contract

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate durable PR record
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const body = (pullRequest?.body ?? '').replace(/<!--[\s\S]*?-->/gu, '');

            const requiredSections = [
              'Outcome',
              'Work authority',
              'Plan',
              'Changes and commits',
              'Verification',
              'Risk and rollback',
              'Completion summary',
              'Submission checklist',
            ];
            const missingSections = requiredSections.filter(
              (section) => !body.includes(`## ${section}`),
            );

            const requiredFields = [
              'Work item / Issue',
              'Proposal / decision',
              'Assignment / checkpoint',
              'Actor',
              'Human authority',
              'Agent / capacity provider',
              'Exact base ref',
              'Exact head ref',
            ];
            const missingFields = requiredFields.filter((field) => {
              const escaped = field.replace(/[.*+?^$()|[\]\\]/gu, '\\$&');
              return !new RegExp(`^- ${escaped}:\\s*\\S.+$`, 'mu').test(body);
            });

            const contributorModes = body.match(
              /^- \[[xX]\] (?:Human-authored|Agent-assisted under human authority|Agent-authored under human authority)$/gmu,
            ) ?? [];

            const errors = [];
            if (missingSections.length > 0) {
              errors.push(`missing sections: ${missingSections.join(', ')}`);
            }
            if (missingFields.length > 0) {
              errors.push(`missing work-authority values: ${missingFields.join(', ')}`);
            }
            if (contributorModes.length !== 1) {
              errors.push('select exactly one contributor mode');
            }

            if (!pullRequest?.draft) {
              const readinessItems = [
                'The change is bounded to the stated work item and target repository.',
                'Exact base and head refs are recorded and the branch is ready for review.',
                'Verification and compatibility evidence are recorded above.',
                'No plaintext secrets, credentials, machine state, or unrelated residue are included.',
                'Plan, status, commits, and completion summary form a complete durable record.',
                'Rollback or recovery steps are documented and executable.',
              ];
              const unchecked = readinessItems.filter(
                (item) => !body.split(/\r?\n/u).some(
                  (line) => line.trim() === `- [x] ${item}` || line.trim() === `- [X] ${item}`,
                ),
              );
              if (unchecked.length > 0) {
                errors.push(`ready PR has incomplete checklist items: ${unchecked.join(' | ')}`);
              }
            }

            if (errors.length > 0) {
              core.setFailed(
                `Complete .github/PULL_REQUEST_TEMPLATE.md in the PR description: ${errors.join('; ')}`,
              );
            }
