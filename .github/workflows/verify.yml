name: Verify TreeSeed Agent

on:
  push:
    branches: [staging, main]
    paths-ignore: ["docs/src/content/**"]
  pull_request:
    # Required verification must also run for ancestry-only reconciliation PRs.
  workflow_dispatch:
  workflow_call:

jobs:
  verify:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    env:
      TREESEED_DEVELOPMENT_WORKSPACE_ROOT: ${{ github.workspace }}/.treeseed/platform-authority
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout exact canonical execution authority
        uses: actions/checkout@v4
        with:
          repository: treeseed-ai/platform
          ref: cddfafc226a950e28fc63f07ffbbf61c16a9e3a3
          path: .treeseed/platform-authority
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        timeout-minutes: 20
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read checked development materialization artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/deployment
          run-id: 39020653453
          name: deployment-candidate-02f02baa6de001df91e026c20cc507ba1fc85d40
          path: .treeseed/tools/deployment-candidate
      - name: Read checked public CLI composition artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/cli
          run-id: 38647918411
          name: cli-6e2579428f4959906cd5b9b669ebbb2b44cb495c
          path: .treeseed/tools/cli-candidate
      - name: Read original checked Deployment SDK build input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/sdk
          run-id: 37451351249
          name: sdk-cbc03314871d271bce7275c5cee71d950397a0c3
          path: .treeseed/tools/deployment-build-sdk
      - name: Install exact checked development inputs without publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -e '.repository == "treeseed-ai/deployment" and .commit == "02f02baa6de001df91e026c20cc507ba1fc85d40"' .treeseed/tools/deployment-candidate/exact-head.json
          test "$(gh api repos/treeseed-ai/cli/actions/runs/38647918411 --jq '[.head_sha,.status,.conclusion]|join(" ")')" == '2b27d26c23905423d90c73abb24c888c452a8745 completed success'
          echo 'a584e6ed61185147d2f5fff237618a0035f868a31bf3e328cedcc3e0006659c1  .treeseed/tools/deployment-candidate/treeseed-deployment-runtime-0.1.0-rc.321.tgz' | sha256sum --check --strict
          echo '49b6d24882af45ba39fd46cdcd999c9c54e84bd416f834fa0042ec5425dbea1a  .treeseed/tools/cli-candidate/treeseed-cli-0.13.0-rc.85.tgz' | sha256sum --check --strict
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund ./.treeseed/tools/deployment-candidate/treeseed-deployment-runtime-0.1.0-rc.321.tgz ./.treeseed/tools/cli-candidate/treeseed-cli-0.13.0-rc.85.tgz
          test "$(gh api repos/treeseed-ai/sdk/actions/runs/37451351249 --jq '[.head_sha,.status,.conclusion]|join(" ")')" == 'cbc03314871d271bce7275c5cee71d950397a0c3 completed success'
          echo 'ef262c2a69fdbd53cea81b60f21817275df0a0a6d40af7df32c4405b6f724e47  .treeseed/tools/deployment-build-sdk/treeseed-sdk-0.13.0-rc.122.tgz' | sha256sum --check --strict
          rm -rf node_modules/@treeseed/deployment/node_modules/@treeseed/sdk
          mkdir -p node_modules/@treeseed/deployment/node_modules/@treeseed/sdk
          tar -xzf .treeseed/tools/deployment-build-sdk/treeseed-sdk-0.13.0-rc.122.tgz --strip-components=1 -C node_modules/@treeseed/deployment/node_modules/@treeseed/sdk
          npm install --prefix node_modules/@treeseed/deployment/node_modules/@treeseed/sdk --omit=dev --ignore-scripts --package-lock=false --no-save --no-audit --no-fund
      - uses: treeseed-ai/sdk/.github/actions/install-exact-sdk@ab5ad06894610c5566aa32bbffc7c027a4e3f4ce
        env:
          NODE_ENV: production
        with:
          github-token: ${{ github.token }}
      - name: Prepare disposable native relay CA
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor tini
          # Use Ubuntu's packaged per-application namespace policy; never
          # disable AppArmor, relax its sysctl, or run the guest as host root.
          test -f /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          bwrap --unshare-user --unshare-pid --ro-bind / / /usr/bin/true
          test ! -e /run/treeseed/manager/api.sock
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /run/treeseed/manager
          relay_fixture=$(mktemp -d)
          trap 'rm -r "$relay_fixture"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=capacity-agent-test-relay' -keyout "$relay_fixture/key.pem" -out "$relay_fixture/ca.pem"
          openssl x509 -in "$relay_fixture/ca.pem" -noout -checkend 0
          sudo install -d -m 0755 /etc/treeseed/sandbox
          sudo install -m 0644 "$relay_fixture/ca.pem" /etc/treeseed/sandbox/relay-ca.crt
      - name: Build public Agent exports for native acceptance readback
        run: npm run build:dist
      - name: Reproduce whole guest native boundary before complete verification
        run: node node_modules/vitest/vitest.mjs run --config ./vitest.config.ts tests/modern/sandbox/architecture/clock-native.test.ts tests/modern/provider/provider-runner.test.ts tests/modern/kernel/architecture/portable/portable-kernel-integration.test.ts tests/modern/provider/architecture/unresolved-recovery.test.ts tests/modern/provider/architecture/recovery-native.test.ts tests/modern/guarantees/bindings.test.ts tests/modern/kernel/architecture/golden-planning-readback.test.ts tests/modern/guarantees/campaign-chat-native.test.ts tests/modern/kernel/architecture/portable/context-integration.test.ts tests/modern/guarantees/preflight/external/external-native.test.ts tests/modern/guarantees/preflight/packaging/installed-custody-binding.test.ts tests/modern/execution/microvm-result-authority.test.ts tests/modern/execution/sandbox-attempt-native.test.ts tests/modern/execution/sandbox-broker-preparation.test.ts tests/modern/kernel/architecture/custody/public-sandbox-inventory.test.ts tests/modern/guarantees/preflight/campaign-freeze-native.test.ts tests/modern/provider/development/provider-preparation.test.ts
      - name: Reproduce owning current-view and exact historical routing before complete verification
        run: node node_modules/vitest/vitest.mjs run --config ./vitest.config.ts tests/modern/kernel/architecture/portable/cross-project-authority.test.ts tests/modern/kernel/architecture/portable/cross-project-native.test.ts
      - run: bash -lc 'npm run verify:local'
      - name: Execute coded golden component scenes
        uses: treeseed-ai/reviewer/.github/actions/run-scenes@d42b257097d969e0ce96a154bda31344a352a50e
        with:
          ids: guarantee.agent.golden.component-boundaries,guarantee.agent.golden.planning-synthesis-recovery
      - name: Pack verified artifact
        run: test -s artifacts/sbom.cdx.json && test -n "$(find artifacts -maxdepth 1 -name 'treeseed-agent-*.tgz' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  installed-owner-custody:
    needs: verify
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    env:
      TREESEED_INSTALLED_OWNER_INPUTS: >-
        [{"owner":"agent","commit":"${{ github.sha }}","sha256":null,"buildSdk":{"commit":"ab5ad06894610c5566aa32bbffc7c027a4e3f4ce","sha256":"4346e570ce059f1f8e8dc81cb5d78175e368a7c4fa91e9aee3330ac8a785a6a7"}},{"owner":"api","commit":"18c53846a4c85dc143511449b0a213f57196a74a","sha256":"1469153a030e8904807038fb69ca2385705a78149225aaa8c07676b8793a6fef","buildSdk":{"commit":"952195376b53bf39742e64f320f2a3b109cc77c0","sha256":"7ba46c788578f526692e81f3713f05e7c00db900b2d810ec27364cb41c008185"},"buildTreeDx":{"commit":"6d358bb2e536af24918f3c33acb2072b9093a603","sha256":"d6de27b42704b4c899562f290950561132fd0d48f38a95e6624eb853e32691cb"}},{"owner":"sdk","commit":"379fd0684375609601605edb3aac2c091ae0aa33","sha256":"df9bb10a77e0833e6a2d774c50b5d9c5ff8c7b22ef3017b5590a74d04b619e32"},{"owner":"cli","commit":"6e2579428f4959906cd5b9b669ebbb2b44cb495c","sha256":"49b6d24882af45ba39fd46cdcd999c9c54e84bd416f834fa0042ec5425dbea1a"},{"owner":"deployment","commit":"02f02baa6de001df91e026c20cc507ba1fc85d40","sha256":"a584e6ed61185147d2f5fff237618a0035f868a31bf3e328cedcc3e0006659c1"},{"owner":"reviewer","commit":"762725d3794b9f5b3128c1584d3a17495ab6a368","sha256":"e402cbde62812cc8c0d31a9dadc4e4c89bf8c4997e6f2e30870e7eb64b8c2627","buildSdk":{"commit":"77a6908d4e7580716e9e2ab92de80150b02cdb06","sha256":"a31b02194665e8705e8d81331da0901f4088f54deb50a34c236d3a661d2d1aa7"}}]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read held agent archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/agent
          run-id: ${{ github.run_id }}
          name: agent-${{ github.sha }}
          path: .treeseed/installed-owner-inputs/agent
      - name: Read declared native TreeDX runtime source
        uses: actions/checkout@v4
        with:
          repository: treeseed-ai/treedx
          ref: ba464cc2e276aaa4ad0f948b938984ad7263586e
          path: .treeseed/installed-owner-inputs/treedx-source
          persist-credentials: false
      - name: Read held api archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/api
          run-id: 39009778325
          name: api-18c53846a4c85dc143511449b0a213f57196a74a
          path: .treeseed/installed-owner-inputs/api
      - name: Read held sdk archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/sdk
          run-id: 38970276890
          name: sdk-379fd0684375609601605edb3aac2c091ae0aa33
          path: .treeseed/installed-owner-inputs/sdk
      - name: Read held cli archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/cli
          run-id: 38647918411
          name: cli-6e2579428f4959906cd5b9b669ebbb2b44cb495c
          path: .treeseed/installed-owner-inputs/cli
      - name: Read held deployment archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/deployment
          run-id: 39020653453
          name: deployment-candidate-02f02baa6de001df91e026c20cc507ba1fc85d40
          path: .treeseed/installed-owner-inputs/deployment
      - name: Read held reviewer archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/reviewer
          run-id: 38998444210
          name: reviewer-762725d3794b9f5b3128c1584d3a17495ab6a368
          path: .treeseed/installed-owner-inputs/reviewer
      - name: Read exact Agent SDK build input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/sdk
          run-id: 40271189010
          name: sdk-ab5ad06894610c5566aa32bbffc7c027a4e3f4ce
          path: .treeseed/installed-owner-inputs/build-sdk-ab5ad06894610c5566aa32bbffc7c027a4e3f4ce
      - name: Read original API SDK build input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/sdk
          run-id: 37871253007
          name: sdk-952195376b53bf39742e64f320f2a3b109cc77c0
          path: .treeseed/installed-owner-inputs/build-sdk-952195376b53bf39742e64f320f2a3b109cc77c0
      - name: Read original Reviewer SDK build input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/sdk
          run-id: 37548599768
          name: sdk-77a6908d4e7580716e9e2ab92de80150b02cdb06
          path: .treeseed/installed-owner-inputs/build-sdk-77a6908d4e7580716e9e2ab92de80150b02cdb06
      - name: Read original API native TreeDX build input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/api
          run-id: 38246522352
          name: api-source-b08ce98fa99e750eb6e1e8f505c456377b5441b8
          path: .treeseed/installed-owner-inputs/build-treedx-6d358bb2e536af24918f3c33acb2072b9093a603
      - name: Inspect actual installed owner custody without starting scenes
        run: node --import tsx ./scripts/support/verify-installed-owners.ts
      - name: Retain installed custody and failed observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-owner-custody-${{ github.sha }}
          path: artifacts/installed-owner-custody/
          if-no-files-found: error
          retention-days: 30
