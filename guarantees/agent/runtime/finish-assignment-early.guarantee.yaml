schemaVersion: treeseed.guarantee/v1
id: guarantee.agent.runtime.finish-assignment-early.747
journeyIndex: 747
type: agent
subtype: runtime
journey: Finish an assignment early
ownerPackage: "@treeseed/agent"
surface: agent-runtime
summary: Finish when acceptance criteria are met, settle actual usage, and deny further runtime mutations through the one completion path.
status: planned
dependencies: { journeys: [], guarantees: [] }
actors: { allowed: [capacity_operator, project_manager], forbidden: [unauthorized_user] }
devices: { required: [desktop_chromium], optional: [] }
gates: [future]
preconditions: { fixtures: [integrated_treeseed_project], notes: [] }
api: { required: true, verifierRefs: [] }
content: { required: false, verifierRefs: [] }
audit: { required: true, verifierRefs: [agent.golden.clock, agent.golden.runtime-close, agent.golden.runtime-crash, agent.golden.deadline-mutation, agent.golden.productive-overrun, agent.golden.settlement] }
negativeCases: [{ id: false-early-completion-rejected, actor: capacity_operator, verifierRefs: [] }]
evidence: { required: [guarantee_report, verifier_evidence] }
notes:
  - Early termination alone is not rewarded; downstream validation drives calibration.
  - Every assignment receives start and deadline timestamps plus an authoritative live status tool.
  - Model and tool work must fit within the single allocated active duration and absolute deadline; infrastructure teardown is measured separately.
  - The runtime rejects new mutations after completion, handler failure, cancellation, or deadline expiry.
  - Native settlement records actual usage once and releases unused capacity; a stopped assignment is not evidence that its work passed review.
