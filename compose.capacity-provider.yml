services:
  manager:
    image: ${TREESEED_AGENT_MANAGER_IMAGE:-treeseed/agent-manager:${TREESEED_AGENT_IMAGE_TAG:-local}}
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-manager
    command: ["manager"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TREESEED_PROVIDER_ROLE: manager
      TREESEED_PROVIDER_STARTUP_MODE: ${TREESEED_PROVIDER_STARTUP_MODE:-live}
      TREESEED_MANAGEMENT_API_URL: ${TREESEED_MANAGEMENT_API_URL:-}
      TREESEED_MARKET_URL: ${TREESEED_MARKET_URL:-}
      TREESEED_MARKET_ID: ${TREESEED_MARKET_ID:-}
      TREESEED_CAPACITY_PROVIDER_ID: ${TREESEED_CAPACITY_PROVIDER_ID:-}
      TREESEED_CAPACITY_PROVIDER_TEAM_ID: ${TREESEED_CAPACITY_PROVIDER_TEAM_ID:-}
      TREESEED_CAPACITY_PROVIDER_API_KEY: ${TREESEED_CAPACITY_PROVIDER_API_KEY:-}
      TREESEED_PROVIDER_DATA_DIR: /data
      TREESEED_PROVIDER_CHOWN_DATA: ${TREESEED_PROVIDER_CHOWN_DATA:-1}
      TREESEED_PROVIDER_ENVIRONMENT: ${TREESEED_PROVIDER_ENVIRONMENT:-local}
      TREESEED_PROVIDER_CAPABILITIES_FILE: ${TREESEED_PROVIDER_CAPABILITIES_FILE:-}
      TREESEED_PROVIDER_BUDGET_FILE: ${TREESEED_PROVIDER_BUDGET_FILE:-}
      TREESEED_PROVIDER_MAX_CONCURRENT_WORKDAYS: ${TREESEED_PROVIDER_MAX_CONCURRENT_WORKDAYS:-}
      TREESEED_PROVIDER_MAX_CONCURRENT_RUNNERS: ${TREESEED_PROVIDER_MAX_CONCURRENT_RUNNERS:-}
      TREESEED_PROVIDER_DAILY_CREDIT_BUDGET: ${TREESEED_PROVIDER_DAILY_CREDIT_BUDGET:-}
      TREESEED_PROVIDER_MONTHLY_CREDIT_BUDGET: ${TREESEED_PROVIDER_MONTHLY_CREDIT_BUDGET:-}
      TREESEED_CODEX_AUTH_FILE: ${TREESEED_CODEX_AUTH_FILE:-}
      TREESEED_CODEX_AUTH_JSON_B64: ${TREESEED_CODEX_AUTH_JSON_B64:-}
      TREESEED_CODEX_AUTH_OVERWRITE: ${TREESEED_CODEX_AUTH_OVERWRITE:-}
      TREESEED_CODEX_TIMEOUT_MS: ${TREESEED_CODEX_TIMEOUT_MS:-600000}
      TREESEED_TREEDX_BASE_URL: ${TREESEED_TREEDX_BASE_URL:-}
      TREESEED_TREEDX_URL: ${TREESEED_TREEDX_URL:-}
      TREESEED_TREEDX_TOKEN: ${TREESEED_TREEDX_TOKEN:-}
      TREESEED_TREEDX_REPO_ID: ${TREESEED_TREEDX_REPO_ID:-}
      TREESEED_TREEDX_REF: ${TREESEED_TREEDX_REF:-}
      TREESEED_TREEDX_WORKSPACE_ID: ${TREESEED_TREEDX_WORKSPACE_ID:-}
      TREESEED_TREEDX_JWT_ISSUER: ${TREESEED_TREEDX_JWT_ISSUER:-}
      TREESEED_TREEDX_JWT_AUDIENCE: ${TREESEED_TREEDX_JWT_AUDIENCE:-}
      TREESEED_TREEDX_JWT_HS256_SECRET: ${TREESEED_TREEDX_JWT_HS256_SECRET:-}
      TREESEED_TREEDX_PROXY_ACTOR_ID: ${TREESEED_TREEDX_PROXY_ACTOR_ID:-}
      TREESEED_TREEDX_PROXY_TENANT_ID: ${TREESEED_TREEDX_PROXY_TENANT_ID:-}
    volumes:
      - "${TREESEED_PROVIDER_HOST_DATA_DIR:-.treeseed/local-capacity-provider/data}:/data"

  runner:
    image: ${TREESEED_AGENT_RUNNER_IMAGE:-treeseed/agent-runner:${TREESEED_AGENT_IMAGE_TAG:-local}}
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-runner
    command: ["runner"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TREESEED_PROVIDER_ROLE: runner
      TREESEED_PROVIDER_STARTUP_MODE: ${TREESEED_PROVIDER_STARTUP_MODE:-live}
      TREESEED_MANAGEMENT_API_URL: ${TREESEED_MANAGEMENT_API_URL:-}
      TREESEED_MARKET_URL: ${TREESEED_MARKET_URL:-}
      TREESEED_MARKET_ID: ${TREESEED_MARKET_ID:-}
      TREESEED_CAPACITY_PROVIDER_ID: ${TREESEED_CAPACITY_PROVIDER_ID:-}
      TREESEED_CAPACITY_PROVIDER_TEAM_ID: ${TREESEED_CAPACITY_PROVIDER_TEAM_ID:-}
      TREESEED_CAPACITY_PROVIDER_API_KEY: ${TREESEED_CAPACITY_PROVIDER_API_KEY:-}
      TREESEED_PROVIDER_DATA_DIR: /data
      TREESEED_PROVIDER_CHOWN_DATA: ${TREESEED_PROVIDER_CHOWN_DATA:-1}
      TREESEED_PROVIDER_ENVIRONMENT: ${TREESEED_PROVIDER_ENVIRONMENT:-local}
      TREESEED_PROVIDER_CAPABILITIES_FILE: ${TREESEED_PROVIDER_CAPABILITIES_FILE:-}
      TREESEED_PROVIDER_BUDGET_FILE: ${TREESEED_PROVIDER_BUDGET_FILE:-}
      TREESEED_PROVIDER_MAX_CONCURRENT_WORKDAYS: ${TREESEED_PROVIDER_MAX_CONCURRENT_WORKDAYS:-}
      TREESEED_PROVIDER_MAX_CONCURRENT_RUNNERS: ${TREESEED_PROVIDER_MAX_CONCURRENT_RUNNERS:-}
      TREESEED_PROVIDER_DAILY_CREDIT_BUDGET: ${TREESEED_PROVIDER_DAILY_CREDIT_BUDGET:-}
      TREESEED_PROVIDER_MONTHLY_CREDIT_BUDGET: ${TREESEED_PROVIDER_MONTHLY_CREDIT_BUDGET:-}
      TREESEED_CODEX_AUTH_FILE: ${TREESEED_CODEX_AUTH_FILE:-}
      TREESEED_CODEX_AUTH_JSON_B64: ${TREESEED_CODEX_AUTH_JSON_B64:-}
      TREESEED_CODEX_AUTH_OVERWRITE: ${TREESEED_CODEX_AUTH_OVERWRITE:-}
      TREESEED_CODEX_TIMEOUT_MS: ${TREESEED_CODEX_TIMEOUT_MS:-600000}
      TREESEED_TREEDX_BASE_URL: ${TREESEED_TREEDX_BASE_URL:-}
      TREESEED_TREEDX_URL: ${TREESEED_TREEDX_URL:-}
      TREESEED_TREEDX_TOKEN: ${TREESEED_TREEDX_TOKEN:-}
      TREESEED_TREEDX_REPO_ID: ${TREESEED_TREEDX_REPO_ID:-}
      TREESEED_TREEDX_REF: ${TREESEED_TREEDX_REF:-}
      TREESEED_TREEDX_WORKSPACE_ID: ${TREESEED_TREEDX_WORKSPACE_ID:-}
      TREESEED_TREEDX_JWT_ISSUER: ${TREESEED_TREEDX_JWT_ISSUER:-}
      TREESEED_TREEDX_JWT_AUDIENCE: ${TREESEED_TREEDX_JWT_AUDIENCE:-}
      TREESEED_TREEDX_JWT_HS256_SECRET: ${TREESEED_TREEDX_JWT_HS256_SECRET:-}
      TREESEED_TREEDX_PROXY_ACTOR_ID: ${TREESEED_TREEDX_PROXY_ACTOR_ID:-}
      TREESEED_TREEDX_PROXY_TENANT_ID: ${TREESEED_TREEDX_PROXY_TENANT_ID:-}
    volumes:
      - "${TREESEED_PROVIDER_HOST_DATA_DIR:-.treeseed/local-capacity-provider/data}:/data"
