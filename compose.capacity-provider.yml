services:
  manager:
    image: ${TREESEED_AGENT_MANAGER_IMAGE:-treeseed/agent-manager:${TREESEED_AGENT_IMAGE_TAG:-local}}
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-manager
    command: ["manager"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TREESEED_PROVIDER_ROLE: manager
      TREESEED_PROVIDER_STARTUP_MODE: ${TREESEED_PROVIDER_STARTUP_MODE:-live}
      TREESEED_CAPACITY_PROVIDER_MANIFEST: /config/treeseed.capacity-provider.yaml
      TREESEED_PROVIDER_DATA_DIR: /data
      TREESEED_PROVIDER_CHOWN_DATA: ${TREESEED_PROVIDER_CHOWN_DATA:-1}
      TREESEED_PROVIDER_ENVIRONMENT: ${TREESEED_PROVIDER_ENVIRONMENT:-local}
      TREESEED_MARKET_PROFILE_LOCAL_URL: ${TREESEED_MARKET_PROFILE_LOCAL_URL:-http://host.docker.internal:3000}
      TREESEED_MARKET_PROFILE_LOCAL_AUDIENCE: ${TREESEED_MARKET_PROFILE_LOCAL_AUDIENCE:-http://127.0.0.1:3000}
      TREESEED_PROVIDER_CAPABILITIES_FILE: ${TREESEED_PROVIDER_CAPABILITIES_FILE:-}
      TREESEED_PROVIDER_BUDGET_FILE: ${TREESEED_PROVIDER_BUDGET_FILE:-}
      TREESEED_PROVIDER_MAX_CONCURRENT_WORKDAYS: ${TREESEED_PROVIDER_MAX_CONCURRENT_WORKDAYS:-}
      TREESEED_PROVIDER_MAX_CONCURRENT_RUNNERS: ${TREESEED_PROVIDER_MAX_CONCURRENT_RUNNERS:-}
      TREESEED_PROVIDER_DAILY_CREDIT_BUDGET: ${TREESEED_PROVIDER_DAILY_CREDIT_BUDGET:-}
      TREESEED_PROVIDER_MONTHLY_CREDIT_BUDGET: ${TREESEED_PROVIDER_MONTHLY_CREDIT_BUDGET:-}
      TREESEED_CODEX_AUTH_FILE: ${TREESEED_CODEX_AUTH_FILE:-}
      TREESEED_CODEX_AUTH_JSON_B64: ${TREESEED_CODEX_AUTH_JSON_B64:-}
      TREESEED_CODEX_AUTH_OVERWRITE: ${TREESEED_CODEX_AUTH_OVERWRITE:-}
      TREESEED_CODEX_TIMEOUT_MS: ${TREESEED_CODEX_TIMEOUT_MS:-900000}
    volumes:
      - "${TREESEED_PROVIDER_HOST_DATA_DIR:-.treeseed/local-capacity-provider/data}:/data"
      - "${TREESEED_CAPACITY_PROVIDER_MANIFEST:-treeseed.capacity-provider.yaml}:/config/treeseed.capacity-provider.yaml:ro"

  runner:
    image: ${TREESEED_AGENT_RUNNER_IMAGE:-treeseed/agent-runner:${TREESEED_AGENT_IMAGE_TAG:-local}}
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-runner
    command: ["runner"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TREESEED_PROVIDER_ROLE: runner
      TREESEED_PROVIDER_STARTUP_MODE: ${TREESEED_PROVIDER_STARTUP_MODE:-live}
      TREESEED_CAPACITY_PROVIDER_MANIFEST: /config/treeseed.capacity-provider.yaml
      TREESEED_PROVIDER_DATA_DIR: /data
      TREESEED_PROVIDER_CHOWN_DATA: ${TREESEED_PROVIDER_CHOWN_DATA:-1}
      TREESEED_PROVIDER_ENVIRONMENT: ${TREESEED_PROVIDER_ENVIRONMENT:-local}
      TREESEED_MARKET_PROFILE_LOCAL_URL: ${TREESEED_MARKET_PROFILE_LOCAL_URL:-http://host.docker.internal:3000}
      TREESEED_MARKET_PROFILE_LOCAL_AUDIENCE: ${TREESEED_MARKET_PROFILE_LOCAL_AUDIENCE:-http://127.0.0.1:3000}
      TREESEED_PROVIDER_CAPABILITIES_FILE: ${TREESEED_PROVIDER_CAPABILITIES_FILE:-}
      TREESEED_PROVIDER_BUDGET_FILE: ${TREESEED_PROVIDER_BUDGET_FILE:-}
      TREESEED_PROVIDER_MAX_CONCURRENT_WORKDAYS: ${TREESEED_PROVIDER_MAX_CONCURRENT_WORKDAYS:-}
      TREESEED_PROVIDER_MAX_CONCURRENT_RUNNERS: ${TREESEED_PROVIDER_MAX_CONCURRENT_RUNNERS:-}
      TREESEED_PROVIDER_DAILY_CREDIT_BUDGET: ${TREESEED_PROVIDER_DAILY_CREDIT_BUDGET:-}
      TREESEED_PROVIDER_MONTHLY_CREDIT_BUDGET: ${TREESEED_PROVIDER_MONTHLY_CREDIT_BUDGET:-}
      TREESEED_CODEX_AUTH_FILE: ${TREESEED_CODEX_AUTH_FILE:-}
      TREESEED_CODEX_AUTH_JSON_B64: ${TREESEED_CODEX_AUTH_JSON_B64:-}
      TREESEED_CODEX_AUTH_OVERWRITE: ${TREESEED_CODEX_AUTH_OVERWRITE:-}
      TREESEED_CODEX_TIMEOUT_MS: ${TREESEED_CODEX_TIMEOUT_MS:-900000}
    volumes:
      - "${TREESEED_PROVIDER_HOST_DATA_DIR:-.treeseed/local-capacity-provider/data}:/data"
      - "${TREESEED_CAPACITY_PROVIDER_MANIFEST:-treeseed.capacity-provider.yaml}:/config/treeseed.capacity-provider.yaml:ro"
