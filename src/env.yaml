entries:
  TREESEED_CAPACITY_PROVIDER_MANIFEST:
    label: Capacity provider manifest
    group: provider
    description: Path to the repository-governed provider manifest.
    sensitivity: public
    targets: [local-runtime]
    scopes: [local, staging]
    storage: scoped
    requirement: required
    purposes: [config]
    validation: { kind: nonempty }
    sourcePriority: [process-env]
  TREESEED_PROVIDER_DATA_DIR:
    label: Provider data directory
    group: provider
    description: Private runtime state directory for leases, tokens, and receipts.
    sensitivity: private
    targets: [local-runtime]
    scopes: [local, staging]
    storage: scoped
    requirement: required
    purposes: [runtime]
    validation: { kind: nonempty }
    sourcePriority: [process-env]
  TREESEED_PROVIDER_ENVIRONMENT:
    label: Provider environment
    group: provider
    description: Runtime environment name included in provider evidence.
    sensitivity: public
    targets: [local-runtime]
    scopes: [local, staging]
    storage: scoped
    requirement: required
    purposes: [config]
    validation: { kind: nonempty }
    sourcePriority: [process-env]
  TREESEED_AGENT_EXECUTOR_MODULE:
    label: Trusted agent executor module
    group: execution
    description: Optional trusted module that owns model execution; absent means the provider advertises no executable capacity.
    sensitivity: private
    targets: [local-runtime]
    scopes: [local, staging]
    storage: scoped
    requirement: optional
    purposes: [agent-execution]
    validation: { kind: nonempty }
    sourcePriority: [machine-config, process-env]
  TREESEED_SERVER_PROFILE_LOCAL_URL:
    label: Local control-plane URL
    group: control-plane
    description: Reachable local API URL for provider connections using the local server profile.
    sensitivity: public
    targets: [local-runtime]
    scopes: [local]
    storage: scoped
    requirement: optional
    purposes: [config]
    validation: { kind: url }
    sourcePriority: [machine-config, process-env]
  TREESEED_SERVER_PROFILE_LOCAL_AUDIENCE:
    label: Local control-plane audience
    group: control-plane
    description: OAuth audience bound to the local control-plane server profile.
    sensitivity: public
    targets: [local-runtime]
    scopes: [local]
    storage: scoped
    requirement: optional
    purposes: [config]
    validation: { kind: url }
    sourcePriority: [machine-config, process-env]
  TREESEED_PROVIDER_MAX_CONCURRENT_WORKDAYS:
    label: Maximum concurrent workdays
    group: capacity
    description: Provider-local ceiling applied beneath API admission.
    sensitivity: public
    targets: [local-runtime]
    scopes: [local, staging]
    storage: scoped
    requirement: optional
    purposes: [capacity]
    validation: { kind: integer }
    sourcePriority: [process-env]
  TREESEED_PROVIDER_MAX_CONCURRENT_RUNNERS:
    label: Maximum concurrent runners
    group: capacity
    description: Provider-local runner ceiling applied beneath API admission.
    sensitivity: public
    targets: [local-runtime]
    scopes: [local, staging]
    storage: scoped
    requirement: optional
    purposes: [capacity]
    validation: { kind: integer }
    sourcePriority: [process-env]
  TREESEED_PROVIDER_DAILY_AGENT_SECONDS_LIMIT:
    label: Daily agent seconds
    group: capacity
    description: Optional provider-local daily execution ceiling.
    sensitivity: public
    targets: [local-runtime]
    scopes: [local, staging]
    storage: scoped
    requirement: optional
    purposes: [capacity]
    validation: { kind: integer }
    sourcePriority: [process-env]
  TREESEED_PROVIDER_MONTHLY_AGENT_SECONDS_LIMIT:
    label: Monthly agent seconds
    group: capacity
    description: Optional provider-local monthly execution ceiling.
    sensitivity: public
    targets: [local-runtime]
    scopes: [local, staging]
    storage: scoped
    requirement: optional
    purposes: [capacity]
    validation: { kind: integer }
    sourcePriority: [process-env]
