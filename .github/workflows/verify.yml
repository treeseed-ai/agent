name: Verify TreeSeed Agent

on:
  push:
    branches: [staging, main]
    paths-ignore: ["docs/src/content/**"]
  pull_request:
    # Required verification must also run for ancestry-only reconciliation PRs.
  workflow_dispatch:

jobs:
  verify:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        timeout-minutes: 20
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: treeseed-ai/sdk/.github/actions/install-exact-sdk@5973e2d339a51f7b9454e32bf48933ee0b3ab839
        with:
          github-token: ${{ github.token }}
      - run: bash -lc 'npm run verify:local'
      - name: Execute coded golden component scenes
        uses: treeseed-ai/reviewer/.github/actions/run-scenes@4c79b4b2b28c678f2759c6bcca5547b408f53f08
        with:
          ids: guarantee.agent.golden.component-boundaries
      - name: Pack verified artifact
        run: mkdir -p artifacts && npm pack --json --ignore-scripts --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error
