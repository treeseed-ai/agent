    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: codexExecutionSelected
  TREESEED_CODEX_REQUIRE_RELEASE_DECISION:
    label: Require Codex release decision
    group: auth
    description: Requires a governed decision before production release actions may proceed from Codex-backed automation.
    howToGet: Leave true for staging and production unless a separate approval gate replaces it.
    sensitivity: plain
    targets:
      - local-runtime
      - github-variable
      - railway-var
    scopes:
