schemaVersion: treeseed.guarantee-verifiers/v1
ownerPackage: "@treeseed/agent"
verifiers:
  agent.workday.produce-summary:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/kernel/provider-kernel-executor.test.ts
    testName: runs the deterministic Reporter through the scoped TreeDX runtime without invoking a model
  agent.provider.coordinate-multi-team-memberships:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/provider/coordinator-token-isolation.test.ts
    testName: registers, waits for approval, and establishes independent team tokens
  agent.assignment.poll-next:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/provider/runner-admission.test.ts
    testName: polls only with a pinned runtime and releases an empty local claim
  agent.assignment.renew-lease:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/provider/provider-runner.test.ts
    testName: aborts isolated execution and returns the assignment when lease renewal fails
  agent.assignment.return:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/provider/provider-runner.test.ts
    testName: aborts isolated execution and returns the assignment when lease renewal fails
  agent.assignment.complete:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/provider/provider-runner.test.ts
    testName: runs workday execution through AgentKernel and settles the one general result
  agent.assignment.fail:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/provider/provider-runner.test.ts
    testName: reports a productive timeout as terminal with measured active time
  agent.usage.record-execution:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/provider/provider-runner.test.ts
    testName: preserves provider-native failure usage in terminal settlement
  agent.kernel.run-planning:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/kernel/agent-kernel.test.ts
    testName: commits a planning synthesis from the completion summary as one governed Note
  agent.kernel.run-acting-with-approved-decision:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/kernel/provider-kernel-executor.test.ts
    testName: routes a canonical acting assignment through AgentKernel and preserves the verified Git reference
  agent.kernel.release-active-leases:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/lease-recovery.test.ts
    testName: releases a recovery claim that never acquired lease authority
  agent.content.treedx-read-context:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/kernel/provider-kernel-review.test.ts
    testName: serves only an exact granted and materialized context reference to a project handler
  agent.content.treedx-write-artifact:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/kernel/provider-kernel-review.test.ts
    testName: commits a structured Reviewer disposition through the kernel-owned TreeDX path
  agent.content.link-generated-note:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/kernel/agent-kernel.test.ts
    testName: commits a planning synthesis from the completion summary as one governed Note
  agent.execution-provider.codex.contract:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/execution/codex-chat-executor.test.ts
    testName: requires clock checks to bracket every other provider tool action
  agent.runtime.enforce-provider-local-budget:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/provider/active-time-accounting.test.ts
    testName: enforces capability and shared model caps atomically across teams and persists actual consumption
  agent.runtime.protect-provider-host-disk:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/provider/runner-admission.test.ts
    testName: does not lease work below the host disk reserve and resumes only after recovery
  agent.runtime.report-readiness:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/provider-runtime-status.test.ts
    testName: never marks a failed aggregate operation as a healthy loop
  agent.runtime.assignment-time-status:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/execution/codex-chat-executor.test.ts
    testName: reports remaining time from the API-started productive window without a content grant
  agent.trace.inspect-execution:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/kernel/provider-kernel-executor.test.ts
    testName: routes a canonical acting assignment through AgentKernel and preserves the verified Git reference
  agent.trace.assignment-events:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/provider/provider-runner.test.ts
    testName: runs workday execution through AgentKernel and settles the one general result
  agent.trace.redact-provider-secrets:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/execution/codex-chat-executor.test.ts
    testName: preserves tool and model progress categories without secret-bearing payloads
  agent.architecture.normalize-activity-profile-agent:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/kernel/handler-registry.test.ts
    testName: preserves the exact effective activity profile without synthesizing another agent
  agent.architecture.reject-legacy-agent-config:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/kernel/handler-registry.test.ts
    testName: rejects legacy top-level configuration and duplicate profile permission fields
  agent.architecture.register-clean-handlers-only:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/kernel/handler-registry.test.ts
    testName: resolves only registered handlers and rejects retired generic aliases
  agent.architecture.enforce-activity-profile-tool-scope:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/execution/codex-context.test.ts
    testName: binds live TreeDX tools to profile policy, repository, and exact ref
  agent.architecture.enforce-assignment-feature-branch-policy:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/kernel/agent-kernel.test.ts
    testName: rejects a result claiming a different assignment branch
  agent.architecture.produce-structured-estimate:
    kind: vitestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/modern/kernel/provider-kernel-review.test.ts
    testName: commits EstimateHandler output as the one proposal-owned execution plan
  agent.golden.live.lifecycle:
    kind: nodeTestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/acceptance/sdk-runtime-golden.test.ts
    testName: Golden runtime lifecycle evidence satisfies its acceptance boundary
  agent.golden.live.collaboration:
    kind: nodeTestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/acceptance/sdk-runtime-golden.test.ts
    testName: Golden runtime collaboration evidence satisfies its acceptance boundary
  agent.golden.live.graph:
    kind: nodeTestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/acceptance/sdk-runtime-golden.test.ts
    testName: Golden runtime graph evidence satisfies its acceptance boundary
  agent.golden.live.revision:
    kind: nodeTestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/acceptance/sdk-runtime-golden.test.ts
    testName: Golden runtime revision evidence satisfies its acceptance boundary
  agent.golden.live.results:
    kind: nodeTestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/acceptance/sdk-runtime-golden.test.ts
    testName: Golden runtime results evidence satisfies its acceptance boundary
  agent.golden.live.settlement:
    kind: nodeTestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/acceptance/sdk-runtime-golden.test.ts
    testName: Golden runtime settlement evidence satisfies its acceptance boundary
  agent.golden.live.reporter:
    kind: nodeTestCase
    ownerPackage: "@treeseed/agent"
    testFile: tests/acceptance/sdk-runtime-golden.test.ts
    testName: Golden runtime reporter evidence satisfies its acceptance boundary
