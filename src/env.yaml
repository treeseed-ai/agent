        - workspace_write
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: codexExecutionSelected
  TREESEED_CODEX_TIMEOUT_MS:
    label: Codex execution timeout
    group: auth
    description: Maximum Codex execution duration in milliseconds for one agent task.
    howToGet: Set a bounded timeout that matches the worker queue lease and expected task complexity.
    sensitivity: plain
    targets:
