notes:
  - Early termination alone is not rewarded; downstream validation drives calibration.
  - Every assignment receives start and deadline timestamps plus an authoritative live status tool.
  - Preparation and protected closeout are separately bounded custody phases and never reduce or inflate the provider-compatible productive execution allocation.
  - Exact initial-plan read-back starts productive execution; terminal summary begins closeout and releases unused productive seconds.
  - Closeout stops scope expansion, preserves valid work, records exact resume instructions, and may propose—not self-authorize—additional capacity.
  - Every mutation requires an initial TreeDX-backed plan; status updates use exact assignment state and append-only lineage; terminal and suspended outcomes require a summary.
