name: Verify TreeSeed Agent

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run release:setup || (echo "dependency install failed; retrying" && npm run release:setup)
      - run: bash -lc 'npm run verify:local'
