name: Verify TreeSeed Agent

on:
  push:
    branches: [staging, main]
    paths-ignore: ["docs/src/content/**"]
  pull_request:
    # Required verification must also run for ancestry-only reconciliation PRs.
  workflow_dispatch:
  workflow_call:

jobs:
  verify:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    env:
      TREESEED_DEVELOPMENT_WORKSPACE_ROOT: ${{ github.workspace }}/.treeseed/platform-authority
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout exact canonical execution authority
        uses: actions/checkout@v4
        with:
          repository: treeseed-ai/platform
          ref: e4c4cad1e526f53d3549c8fc27c3e60122b20ee4
          path: .treeseed/platform-authority
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        timeout-minutes: 20
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read checked development materialization artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/deployment
          run-id: 37041701461
          name: deployment-candidate-a4e638cb5e861766fedf1b67adfba2e910c6afd1
          path: .treeseed/tools/deployment-candidate
      - name: Read checked public CLI composition artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/cli
          run-id: 37045080284
          name: cli-candidate-b62c4bd9408f87dd88a46391a61e249f3c4d073f
          path: .treeseed/tools/cli-candidate
      - name: Install exact checked development inputs without publication
        run: |
          set -euo pipefail
          jq -e '.repository == "treeseed-ai/deployment" and .commit == "a4e638cb5e861766fedf1b67adfba2e910c6afd1"' .treeseed/tools/deployment-candidate/exact-head.json
          jq -e '.candidate.sourceCommit == "b62c4bd9408f87dd88a46391a61e249f3c4d073f"' .treeseed/tools/cli-candidate/release-evidence-v1.json
          echo 'bb493312538753c46a09e8ff768155b8584064dd90c8f3d1e6caae85e3012b35  .treeseed/tools/deployment-candidate/treeseed-deployment-runtime-0.1.0-rc.321.tgz' | sha256sum --check --strict
          echo 'b8681e69511055a0403296acb50d44357098e3da07678a089dcf04b5d3de873d  .treeseed/tools/cli-candidate/treeseed-cli-0.13.0-rc.85.tgz' | sha256sum --check --strict
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund ./.treeseed/tools/deployment-candidate/treeseed-deployment-runtime-0.1.0-rc.321.tgz ./.treeseed/tools/cli-candidate/treeseed-cli-0.13.0-rc.85.tgz
      - uses: treeseed-ai/sdk/.github/actions/install-exact-sdk@8536de5233983765a049392f307244d741470480
        with:
          github-token: ${{ github.token }}
      - name: Prepare disposable native relay CA
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor
          # Use Ubuntu's packaged per-application namespace policy; never
          # disable AppArmor, relax its sysctl, or run the guest as host root.
          test -f /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          bwrap --unshare-user --unshare-pid --ro-bind / / /usr/bin/true
          relay_fixture=$(mktemp -d)
          trap 'rm -r "$relay_fixture"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=capacity-agent-test-relay' -keyout "$relay_fixture/key.pem" -out "$relay_fixture/ca.pem"
          openssl x509 -in "$relay_fixture/ca.pem" -noout -checkend 0
          sudo install -d -m 0755 /etc/treeseed/sandbox
          sudo install -m 0644 "$relay_fixture/ca.pem" /etc/treeseed/sandbox/relay-ca.crt
      - name: Reproduce whole guest native boundary before complete verification
        run: node node_modules/vitest/vitest.mjs run --config ./vitest.config.ts tests/modern/sandbox/architecture/clock-native.test.ts
      - run: bash -lc 'npm run verify:local'
      - name: Execute coded golden component scenes
        uses: treeseed-ai/reviewer/.github/actions/run-scenes@e60ad2581e7ff041f058af04bd810796fea748f9
        with:
          ids: guarantee.agent.golden.component-boundaries,guarantee.agent.golden.planning-synthesis-recovery
      - name: Pack verified artifact
        run: test -s artifacts/sbom.cdx.json && test -n "$(find artifacts -maxdepth 1 -name 'treeseed-agent-*.tgz' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  installed-owner-custody:
    needs: verify
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    env:
      TREESEED_INSTALLED_OWNER_INPUTS: >-
        [{"owner":"agent","commit":"${{ github.sha }}","sha256":null},{"owner":"api","commit":"5f582adf91f92cda7cf1e41f1f39b4f3fb1359f9","sha256":"04c5f93a441a7135c670dc7dec4326da7550589570d84b49e34f87521f56c1c6"},{"owner":"sdk","commit":"1a7c692cd6369a8700c25e447a7fd1461c487922","sha256":"59f508232738dd062b32156a3efefba18ed96b4496566847825545238593cac4"},{"owner":"cli","commit":"f538a7559ae0756e80c66ec222e78d31f0ce5af1","sha256":"f1800c556e023bb36ad17635e9cbbf8496597c277465db105983cd7383d0e637"},{"owner":"deployment","commit":"d2222a3fa354e9ef30a5ef6b40081303c29fe4dc","sha256":"8a33e23e20263820085188e14eed63c3c868f2829c76e8629829c968ecfd1f5d"},{"owner":"reviewer","commit":"3e8221bbdd04de88634065b9148e67449bfa6e29","sha256":"51a59a4d3bfba61fe69f490cab80d776357b3bee10dc7021687946e3be0bec3f"}]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read held agent archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/agent
          run-id: ${{ github.run_id }}
          name: agent-${{ github.sha }}
          path: .treeseed/installed-owner-inputs/agent
      - name: Read held api archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/api
          run-id: 38246522352
          name: api-b08ce98fa99e750eb6e1e8f505c456377b5441b8
          path: .treeseed/installed-owner-inputs/api
      - name: Read held sdk archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/sdk
          run-id: 38344412551
          name: sdk-df3fa7e310583311d3e8e5eb61d59738822dc772
          path: .treeseed/installed-owner-inputs/sdk
      - name: Read held cli archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/cli
          run-id: 38381452116
          name: cli-cdd8ad00fcc8b02db0c31bc5637d0d0412ab843e
          path: .treeseed/installed-owner-inputs/cli
      - name: Read held deployment archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/deployment
          run-id: 38276866252
          name: deployment-candidate-5b93cc037d7e138f81f4e9c89c2d877efbd38c20
          path: .treeseed/installed-owner-inputs/deployment
      - name: Read held reviewer archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: treeseed-ai/reviewer
          run-id: 38374788689
          name: reviewer-99d18d14adfb2e66b292b4ab505c14ffd7a2d4ad
          path: .treeseed/installed-owner-inputs/reviewer
      - name: Inspect actual installed owner custody without starting scenes
        run: node --import tsx ./scripts/support/verify-installed-owners.ts
      - name: Retain installed custody and failed observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-owner-custody-${{ github.sha }}
          path: artifacts/installed-owner-custody/
          if-no-files-found: error
          retention-days: 30
