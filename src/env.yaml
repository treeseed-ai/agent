        - on_request
        - always
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: codexExecutionSelected
  TREESEED_CODEX_SANDBOX_MODE:
    label: Codex sandbox mode
    group: auth
    description: Sandbox mode passed to Codex execution for hosted workers.
    howToGet: Use workspace_write for mutation-capable workers and read_only for inspection-only workers.
    sensitivity: plain
    targets:
